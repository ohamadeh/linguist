name: octo-sts debug workflow
on:
  workflow_dispatch:

permissions:
  id-token: write


jobs:
  test-job:
    runs-on: self-hosted
    steps:
      - uses: octo-sts/action@7a6ea3bef15ee86a65ffbaf678b6578a69a68610
        id: octo-sts
        with:
          scope: ohamadeh/linguist
          identity: foo

      - env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          env  > env.txt
          gh repo list
          sleep 10000