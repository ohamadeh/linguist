name: qoomon workflow will fail
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read


jobs:
  test-job:
    runs-on: self-hosted
    steps:
      - uses: qoomon/actions--access-token@v3
        id: access-token
        with:
          owner: ohamadeh
          repository: argocd-example-apps
          permissions: |
            contents: write
            pull-requests: write
      - name: Attempt to create issue
        env:
          GITHUB_TOKEN: ${{ steps.access-token.outputs.token }}
        run: |
          gh issue create \
            --repo ohamadeh/argocd-example-apps \
            --title "Test issue from qoomon-will-fail workflow" \
            --body "Created by the qoomon-will-fail workflow to check token permission scope."
