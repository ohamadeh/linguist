name: qoomon basic workflow
on:
  workflow_dispatch:

permissions:
  id-token: write


jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - uses: qoomon/actions--access-token@2cdcb8b86535fa42689d7599478d254770a714ec
        id: access-token
        with:
          owner: ohamadeh
          repository: linguist
          permissions: |
            contents: write
            pull-requests: write
      - env:
          GITHUB_TOKEN: ${{ steps.access-token.outputs.token }}
        run: |
          gh repo list